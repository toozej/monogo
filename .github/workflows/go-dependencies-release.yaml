---
name: Release Go dependency updates

on:
  push:
    branches:
      - main
    paths:
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: go-dependencies-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # GITHUB_TOKEN tag pushes do not trigger the tag-driven Release workflow.
      # Reuse the autoupdate App, scoped to this repository, to publish tags.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOUPDATE_APP_ID }}
          private-key: ${{ secrets.AUTOUPDATE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout dependency update
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Configure release tag author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Patch release all previously released apps
        # This target runs each app's tests and pushes its next patch tag.
        # The existing Release workflow builds and publishes each tagged app.
        run: make release-all TYPE=patch
