---
name: Go version autoupdate

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for a new Go release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(awk '$1 == "go" { print $2; exit }' go.mod)"
          latest="$(curl --fail --silent --show-error 'https://go.dev/dl/?mode=json' \
            | jq -er '.[0].version')"
          latest="${latest#go}"
          if [[ ! "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Go release version: $latest" >&2
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [[ "$latest" != "$current" \
            && "$(printf '%s\n' "$current" "$latest" | sort -V | tail -n 1)" == "$latest" ]]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "Go $latest is newer than Go $current"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "Go $current is current"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.update == 'true'
        with:
          go-version: ${{ steps.version.outputs.latest }}
          check-latest: true

      - name: Upgrade Go across the repository
        if: steps.version.outputs.update == 'true'
        run: scripts/update_golang_version.sh "${{ steps.version.outputs.latest }}"

      - name: Update Go dependencies
        id: dependencies
        if: steps.version.outputs.update == 'true'
        continue-on-error: true
        run: |
          make local-update-deps
          make local-vendor

      - name: Regenerate app configs
        id: configs
        if: steps.version.outputs.update == 'true'
        continue-on-error: true
        run: make generate-all

      - name: Update pinned tools and pre-commit hooks
        id: tools
        if: steps.version.outputs.update == 'true'
        continue-on-error: true
        run: make pre-commit-update

      # An App token makes pushes to the update PR trigger the normal CI workflow.
      - name: Generate GitHub App token
        id: app-token
        if: steps.version.outputs.update == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AUTOUPDATE_APP_ID }}
          private-key: ${{ secrets.AUTOUPDATE_APP_PRIVATE_KEY }}

      - name: Ensure dependencies label exists
        if: steps.version.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create dependencies \
            --color "0366d6" \
            --description "Pull requests that update a dependency" \
            --force

      - name: Create pull request
        if: steps.version.outputs.update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore(go): upgrade to ${{ steps.version.outputs.latest }}"
          title: "chore(go): upgrade to ${{ steps.version.outputs.latest }}"
          body: |
            Upgrade Go from ${{ steps.version.outputs.current }} to ${{ steps.version.outputs.latest }}.

            The workflow updated Go dependencies and pinned tools before opening this PR.
            Update results: dependencies `${{ steps.dependencies.outcome }}`, app configs `${{ steps.configs.outcome }}`, tools `${{ steps.tools.outcome }}`.
            CI checks the complete change.
          branch: chore/go-version-autoupdate
          delete-branch: true
          labels: dependencies
