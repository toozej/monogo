StylesPath = .vale/styles
MinAlertLevel = suggestion
Packages = https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/vale-llm-slop.zip

[*.{md,markdown}]
BasedOnStyles = Slop, STE
Slop = warning
STE = warning
STE.Contractions = error
STE.Dictionary = NO
STE.ProcedureLength = suggestion
STE.Gerunds = suggestion
Slop.EmDash = suggestion
Slop.Headers = suggestion
Slop.Tricolon = suggestion

# Downloaded styles contain examples that intentionally violate their rules.
[**/.vale/**]
BasedOnStyles = NONE
