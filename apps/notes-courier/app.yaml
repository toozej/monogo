---
name: notes-courier
binary: notes-courier
path: apps/notes-courier
mainPath: apps/notes-courier
description: "Move notes from Simplenote, Memos, or Obsidian to Memos, Obsidian, Hugo, or go-vite"
shortDescription: "Move notes between note platforms"
goImage: golang:1.27.4-trixie
# Both tag families need an APT-based runtime for Python and sncli.
distrolessImage: debian:trixie-slim
runtimeImage: debian:trixie-slim
runtimeAptPackages:
  - ca-certificates
  - python3
  - python3-pip
  - python3-venv
runtimePipPackages:
  - sncli==0.4.4
runtimeEnv:
  HOME: /home/nonroot
writableDirs:
  - /home/nonroot
workDir: /home/nonroot
compose:
  volumes:
    - notes-courier-home:/home/nonroot
  namedVolumes:
    - notes-courier-home
# cgoEnabled defaults to false. When true, builds use CGO_ENABLED=1, the runtime
# image becomes glibc-capable (debian:trixie-slim / distroless base-debian), and
# GoReleaser is trimmed to the native linux/amd64 platform.
cgoEnabled: false
# runtimeImage (optional) overrides the runtime base for the non-distroless
# Dockerfile. Defaults to "scratch", or "debian:trixie-slim" when cgoEnabled is true.
# runtimeImage: debian:trixie-slim
# port (optional) is EXPOSEd in the generated Dockerfiles when set.
# port: 8081
