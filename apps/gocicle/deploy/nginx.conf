# Install this file in the nginx http context.
server {
    listen 80;
    server_name gocicle.example.com;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name gocicle.example.com;
    ssl_certificate /etc/letsencrypt/live/gocicle.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gocicle.example.com/privkey.pem;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 60s;
    }
}
