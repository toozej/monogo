# Check Markdown links with bounded concurrency and retries.
timeout = 20
max_retries = 2
retry_wait_time = 2
max_concurrency = 8
host_concurrency = 2
host_request_interval = "100ms"
no_progress = true
cache = false

# Local server examples require services that do not run in documentation CI.
exclude_loopback = true
# Email delivery and addresses inside code examples are outside this check.
include_mail = false
include_verbatim = false

# Verified 2026-10-13: these two credit sources require browser challenges.
# Stack Overflow returns Cloudflare's 403 challenge; Golang Cafe returns
# Vercel's 429 challenge. Keep the citations and exclude only these exact URLs.
# The Substack article is available locally but returns 403 to GitHub Actions.
# The Datadog article returns 200 locally, but connections failed in two CI runs:
# https://github.com/toozej/monogo/actions/runs/38441048214
# https://github.com/toozej/monogo/actions/runs/38444721520
exclude = [
    '^https://stackoverflow\.com/a/60675491$',
    '^https://golang\.cafe/blog/how-to-upgrade-golang-dependencies$',
    '^https://2amsecurity\.substack\.com/p/threat-modeling-github-how-vulnerable$',
    '^https://securitylabs\.datadoghq\.com/articles/case-for-github-actions-security/$',
]

# These paths contain downloaded styles, tools, dependencies, build output,
# or archived import metadata. scripts/check-docs.sh also filters input paths.
exclude_path = ['(^|/)(\.vale|\.tools|\.monogo|vendor|node_modules|dist)/']
